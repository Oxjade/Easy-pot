<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>EasyPot</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Sign in -->
  <section id="login" class="login" hidden>
    <div id="login-art" class="login-art" aria-hidden="true"></div>
    <form id="login-form" class="login-form">
      <svg class="mark mark-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6 20.1 7.3v9.4L12 21.4 3.9 16.7V7.3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 8.3 15.2 10.15v3.7L12 15.7 8.8 13.85v-3.7z" fill="currentColor"/></svg>
      <h1>Sign in to EasyPot</h1>
      <p class="login-lede">Paste the admin token from your config file or the startup log.</p>
      <label for="token-input" class="field-label">Admin token</label>
      <div class="login-row">
        <input id="token-input" type="password" autocomplete="current-password" spellcheck="false" required>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </div>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6 20.1 7.3v9.4L12 21.4 3.9 16.7V7.3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 8.3 15.2 10.15v3.7L12 15.7 8.8 13.85v-3.7z" fill="currentColor"/></svg>
        <span>EasyPot</span>
      </div>
      <div class="site" title="The site EasyPot is protecting">
        <span class="pulse" aria-hidden="true"></span>
        <div class="site-text">
          <div id="site-name" class="site-name">—</div>
          <div id="upstream" class="site-upstream mono">—</div>
        </div>
      </div>
      <nav class="nav" aria-label="Main">
        <div class="nav-group">Monitor</div>
        <a href="#/overview" data-route="overview" data-icon="overview">Overview</a>
        <a href="#/actors" data-route="actors" data-icon="attackers">Attackers</a>
        <a href="#/events" data-route="events" data-icon="events">Event log</a>
        <div class="nav-group">Defend</div>
        <a href="#/decoys" data-route="decoys" data-icon="decoys">Decoys</a>
        <a href="#/blocks" data-route="blocks" data-icon="blocks">Blocklist</a>
        <div class="nav-group">Connect</div>
        <a href="#/integrations" data-route="integrations" data-icon="integrations">Integrations</a>
      </nav>
      <button id="logout" class="nav-foot" type="button" data-icon="logout">Sign out</button>
    </aside>

    <main class="main">
      <header class="page-head">
        <div class="page-head-text">
          <h1 id="page-title">Overview</h1>
          <p id="page-sub"></p>
        </div>
        <div class="page-head-actions">
          <span id="live" class="live" title="Live event stream"><span class="dot" aria-hidden="true"></span><span id="live-text">Connecting</span></span>
          <div id="range" class="seg" role="group" aria-label="Time range">
            <button type="button" data-hours="24" class="on">24 hours</button>
            <button type="button" data-hours="168">7 days</button>
            <button type="button" data-hours="720">30 days</button>
          </div>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <!-- Attacker drawer -->
  <div id="drawer-backdrop" class="backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-label="Attacker details"></aside>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js" type="module"></script>
</body>
</html>
